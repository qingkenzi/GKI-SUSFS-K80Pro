name: K80Pro V3 parse-test
on:
  workflow_dispatch:
jobs:
  build:
    if: ${{ false }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: android15
      kernel_version: "6.6"
      sub_level: "118"
      os_patch_level: "2026-01"
      ksu_variant: SukiSU
      use_zram: false
      use_bbg: true
      use_kpm: "disabled (关闭)"
      enable_susfs: true
