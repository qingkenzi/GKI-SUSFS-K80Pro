name: K80Pro 定版构建 V2(parse-test)

# 定版参数全部固化在本文件，派发时 body 只需 {"ref":"dev"}
# 产出：最终可刷的 boot.img.xz（96MB 分区镜像），推到 delivery 分支 + 作为 artifact 上传
# 手机端取用：bash ~/roo/tools/fetch_boot.sh <run_id|latest>

on:
  workflow_dispatch:
    inputs:
      flash_note:
        description: "本次构建备注（写进 manifest，可留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: 构建内核
    if: ${{ false }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # ---- 内核基线（对应数据见 data/android15/6.6.json）----
      android_version: android15
      kernel_version: "6.6"
      sub_level: "118"
      os_patch_level: "2026-01"
      revision: "r1"
      # ---- KSU / SUSFS ----
      ksu_variant: SukiSU
      ksu_mode: "关闭"            # 注意：本仓库语义为「KSU + SUSFS 都开启」
      enable_susfs: true
      version: ""                 # 留空 => 保留 -android15-8-g<hash>-<bid> 的 KMI 后缀
      build_time: ""              # 留空 => 使用当前 UTC
      # ---- 功能开关定版（依据 bench/RESULTS.md 实测）----
      use_zram: false             # 弃用：收益微小 + 原版补丁会卡 Mi logo
      use_bbg: true               # 保留：基带保护，LSM 正常
      use_networking: true        # 保留：BBRv3 默认 + ipset/wireguard/cifs
      cve_2026_43499_patch: true  # 保留：rtmutex 修复链
      use_nomount: false          # 与 hybrid_mount 重叠
      use_kpm: "disabled (关闭)"   # patched 模式尚不支持
      use_rekernel: false         # 与现有隐藏方案重叠
      supp_op: false              # 一加专用
      droidspaces: "off"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"

  # package job 暂时移除（二分校验）
