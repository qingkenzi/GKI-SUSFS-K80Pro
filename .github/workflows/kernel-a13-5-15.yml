name: 内核构建 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 下拉选项 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - BakaSU
        default: BakaSU
      ksu_mode:
        description: "KernelSU / SUSFS 模式"
        required: true
        type: choice
        options:
          - 关闭
          - 禁用SUSFS
          - 禁用KSU
        default: 关闭
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "构建产物上传模式"
        required: true
        type: choice
        options:
          - "仅上传 AnyKernel3.zip"
          - "上传全部"
        default: "仅上传 AnyKernel3.zip"

      version_scope:
        description: "构建范围（all=数据里全部月度 | latest=仅最新 | lts=仅LTS | 数字=最近N个）"
        required: true
        type: string
        default: "all"

      # ==================== 文本输入 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 开关（默认关闭） ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      use_nomount:
        description: "启用 NoMount 挂载元模块"
        required: false
        type: boolean
        default: false
      use_networking:
        description: "启用网络增强（BBRv3 / IPSet / Qdisc / CIFS）"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "应用 CVE-2026-43499 rtmutex 修复链"
        required: false
        type: boolean
        default: false
      droidspaces_ntsync:
        description: "启用 Droidspaces 容器 NTSync 支持（需启用 Droidspaces）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      use_nomount:
        required: false
        type: boolean
        default: false
      use_networking:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      ksu_mode:
        required: false
        type: string
        default: 关闭
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "上传全部"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      version_scope:
        description: "构建范围（all | latest | lts | 最近N个）"
        required: false
        type: string
        default: "all"
      called_from_main:
        description: "是否从 main.yml 调用（内部使用）"
        required: false
        type: boolean
        default: false
      export_susfs_patches:
        description: "导出 SUSFS 集成补丁（由 main.yml 传入）"
        required: false
        type: boolean
        default: false

jobs:
  # 矩阵由 data/<android>/<kernel>.json 动态生成：手写矩阵会随时间陈旧，
  # 新发布的月度分支永远进不来（例如 2026-07 / 2026-10）
  resolve-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: 从版本数据生成矩阵
        id: gen
        env:
          ANDROID_VERSION: android13
          KERNEL_VERSION: "5.15"
          VERSION_SCOPE: ${{ inputs.version_scope || 'all' }}
          INCLUDE_LTS: "true"
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          android = os.environ["ANDROID_VERSION"]
          kver = os.environ["KERNEL_VERSION"]
          scope = os.environ["VERSION_SCOPE"].strip().lower()
          include_lts = os.environ.get("INCLUDE_LTS", "true").lower() == "true"

          data_path = Path("data") / android / (kver + ".json")
          if not data_path.exists():
              print(f"::error::未找到版本数据: {data_path}")
              sys.exit(1)

          data = json.loads(data_path.read_text(encoding="utf-8"))
          entries = data.get("entries", [])
          if not entries:
              print(f"::error::{data_path} 没有版本数据")
              sys.exit(1)

          if scope in ("", "all"):
              selected = entries
          elif scope in ("latest", "1"):
              selected = entries[-1:]
          elif scope == "lts":
              selected = []
              include_lts = True
          else:
              try:
                  limit = int(scope)
              except ValueError:
                  print(f"::error::无法解析 version_scope: {scope}（可用 all/latest/lts/数字）")
                  sys.exit(1)
              selected = entries[-limit:] if limit > 0 else entries

          inc = [
              {
                  "sub_level": str(entry.get("kernel", "")).rsplit(".", 1)[-1],
                  "os_patch_level": entry.get("date", ""),
              }
              for entry in selected
          ]
          if include_lts and data.get("lts") and not any(x["os_patch_level"] == "lts" for x in inc):
              inc.append({"sub_level": "X", "os_patch_level": "lts"})

          if not inc:
              print("::error::没有可构建的版本，请检查 version_scope")
              sys.exit(1)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps({"include": inc}, separators=(",", ":")) + "\n")
              output.write("count=" + str(len(inc)) + "\n")

          print(f"生成矩阵 {len(inc)} 项: " + ", ".join(f"{x['os_patch_level']}->{x['sub_level']}" for x in inc))
          PY

  build-kernels-a13-5-15:
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    needs: resolve-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-matrix.outputs.matrix) }}
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      use_nomount: ${{ inputs.use_nomount || false }}
      use_networking: ${{ inputs.use_networking || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      export_susfs_patches: ${{ inputs.export_susfs_patches || false }}
      supp_op: false
      enable_susfs: ${{ inputs.ksu_mode != '禁用SUSFS' && inputs.ksu_mode != '禁用KSU' }}
      ksu_mode: ${{ inputs.ksu_mode || '关闭' }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # 仅在直接触发时运行，从 main.yml 调用时跳过
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
