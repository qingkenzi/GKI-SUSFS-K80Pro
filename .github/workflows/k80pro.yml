name: K80Pro 定版构建

# 定版参数全部固化在本文件，派发时 body 只需 {"ref":"dev"}
# 产出：最终可刷的 boot.img.xz（96MB 分区镜像），推到 delivery 分支 + 作为 artifact 上传
# 手机端取用：bash ~/roo/tools/fetch_boot.sh <run_id|latest>

on:
  workflow_dispatch:
    inputs:
      flash_note:
        description: "本次构建备注（写进 manifest，可留空）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: 构建内核
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      # ---- 内核基线（对应数据见 data/android15/6.6.json）----
      android_version: android15
      kernel_version: "6.6"
      sub_level: "118"
      os_patch_level: "2026-01"
      revision: "r1"
      # ---- KSU / SUSFS ----
      ksu_variant: SukiSU
      ksu_mode: "关闭"            # 注意：本仓库语义为「KSU + SUSFS 都开启」
      enable_susfs: true
      version: ""                 # 留空 => 保留 -android15-8-g<hash>-<bid> 的 KMI 后缀
      build_time: ""              # 留空 => 使用当前 UTC
      # ---- 功能开关定版（依据 bench/RESULTS.md 实测）----
      use_zram: false             # 弃用：收益微小 + 原版补丁会卡 Mi logo
      use_bbg: true               # 保留：基带保护，LSM 正常
      use_networking: true        # 保留：BBRv3 默认 + ipset/wireguard/cifs
      cve_2026_43499_patch: true  # 保留：rtmutex 修复链
      use_nomount: false          # 与 hybrid_mount 重叠
      use_kpm: "disabled (关闭)"   # patched 模式尚不支持
      use_rekernel: false         # 与现有隐藏方案重叠
      supp_op: false              # 一加专用
      droidspaces: "off"
      droidspaces_ntsync: false
      artifact_upload_mode: "上传全部"

  package:
    name: 打包 boot.img
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: 下载内核产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}/artifacts" \
            | python3 -c "import sys,json;print([a['name'] for a in json.load(sys.stdin)['artifacts'] if a['name'].startswith('SukiSU_kernel')][0])")
          echo "内核产物: $NAME"
          gh run download "${{ github.run_id }}" -R "$GITHUB_REPOSITORY" -D dl -n "$NAME"
          find dl -name Image -o -name "*.img" | head -10
          GH_TOKEN="$GH_TOKEN" NAME="$NAME" python3 - <<'PY'
          import os, json
          json.dump({"artifact": os.environ["NAME"]}, open("dl_meta.json", "w"))
          PY

      - name: 用原厂 boot 模板重打包
        run: |
          set -euo pipefail
          xz -dc ci/boot_stock.img.xz > boot_stock.img
          IMG=$(find dl -name Image | head -1)
          [ -n "$IMG" ] || { echo "::error::未找到 Image"; exit 1; }
          python3 ci/repack_boot_v4.py boot_stock.img "$IMG" boot.img --partition-size=100663296
          python3 - <<'PY'
          import struct, sys, hashlib
          d = open("boot.img", "rb").read()
          assert len(d) == 100663296, f"大小异常 {len(d)}"
          assert d[:8] == b"ANDROID!", "magic 异常"
          ksz, rsz = struct.unpack_from("<II", d, 8)
          hv = struct.unpack_from("<I", d, 40)[0]
          assert rsz == 0, f"ramdisk_size 应为 0，实际 {rsz}"
          assert hv == 4, f"header_version 应为 4，实际 {hv}"
          print(f"OK boot.img: kernel_size={ksz} ramdisk=0 header_v={hv}")
          PY
          xz -9e -T0 -c boot.img > boot.img.xz
          sha256sum boot.img | awk '{print $1}' > boot.sha256
          md5sum boot.img | awk '{print $1}' > boot.md5
          KREL=$(strings -a "$IMG" | grep -m1 -o '6\.[0-9]*\.[0-9]*-android15-8[^ ]*' || echo unknown)
          KV=$(strings -a "$IMG" | grep -m1 -o 'v[0-9.]*-[a-z0-9]*@builtin' || echo unknown)
          {
            echo "run_id:        ${{ github.run_id }}"
            echo "commit:        ${{ github.sha }}"
            echo "note:          ${{ inputs.flash_note }}"
            echo "kernel:        $KREL"
            echo "ksu_version:   $KV"
            echo "image_size:    $(stat -c%s "$IMG")"
            echo "boot_md5:      $(cat boot.md5)"
            echo "boot_sha256:   $(cat boot.sha256)"
            echo "built_at:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee manifest.txt
          ls -l boot.img boot.img.xz

      - name: 上传最终 boot.img
        uses: actions/upload-artifact@v5
        with:
          name: k80pro-boot-${{ github.run_id }}
          path: |
            boot.img.xz
            boot.sha256
            boot.md5
            manifest.txt
          retention-days: 90

      - name: 推到 delivery 分支
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp boot.img.xz boot.sha256 boot.md5 manifest.txt "$RUNNER_TEMP/out/"
          git config user.name "artifact-bot"
          git config user.email "bot@users.noreply.github.com"
          git checkout --orphan delivery
          git rm -rf --ignore-unmatch . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          mkdir -p delivery
          cp -a "$RUNNER_TEMP/out/." delivery/
          git add -A delivery
          git commit -m "k80pro boot.img from run ${{ github.run_id }}"
          git push -f origin HEAD:refs/heads/delivery
